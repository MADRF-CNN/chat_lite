services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_lite
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_lite"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-chat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-chat-storage-password}
    volumes:
      - minio_data:/data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD:-chat-dev-password}@postgres:5432/chat_lite?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      NODE_ENV: production
      ENFORCE_TLS: "true"
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://chat.example.com}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: chat-images
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-chat}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-chat-storage-password}
      S3_FORCE_PATH_STYLE: "true"
    expose: ["3000"]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/chat.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  minio_data:
